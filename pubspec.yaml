name: turismo_rural_frontend
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.4
  flutter_svg: ^2.0.10+1
  google_maps_flutter: ^2.6.0
  http: ^1.0.0
  image_picker: ^1.0.7
  lorem_ipsum_generator: ^0.0.3
  mask_text_input_formatter: ^2.9.0
  nested: any
  provider: ^6.1.2
  validators: ^3.0.0

dev_dependencies:
  bloc_test: ^9.1.7
  build_runner: ^2.4.9
  flutter_test:
    sdk: flutter
  husky: ^0.1.7
  lint: ^2.3.0
  mockito: ^5.4.4
  mocktail: ^1.0.3
  network_image_mock: ^2.1.1

flutter:
  assets:
    - .env
    - assets/backgrounds/
  fonts:
    - family: JosefinSans
      fonts:
        - asset: assets/fonts/JosefinSans-Regular.ttf
  uses-material-design: true
