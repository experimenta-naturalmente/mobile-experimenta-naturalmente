name: turismo_rural_frontend
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  amazon_cognito_identity_dart_2: ^3.6.5
  cached_network_image: ^3.3.1
  carousel_slider: ^5.0.0
  cloud_firestore: ^5.5.0
  dio: ^5.4.3+1
  equatable: ^2.0.5
  file_picker: ^8.0.3
  firebase_core: ^3.8.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.4
  flutter_dotenv: ^5.1.0
  flutter_image_compress: ^2.3.0
  flutter_launcher_icons: ^0.13.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.9
  fluttericon: ^2.0.0
  google_fonts: ^4.0.4
  google_maps_flutter: ^2.6.0
  http: ^0.13.5
  image: ^4.2.0
  image_picker: ^1.0.7
  intl: any
  lorem_ipsum_generator: ^0.0.3
  mask_text_input_formatter: ^2.9.0
  media_kit: ^1.1.10+1
  nested: any
  path_provider: ^2.1.3
  provider: ^6.1.2
  syncfusion_flutter_datepicker: ^29.2.7
  time_range_picker: 
    git:
      url: https://github.com/mariahbf/flutter_time_range_picker.git
      ref: master
  universal_io: ^2.2.2
  validators: ^3.0.0
dev_dependencies:
  bloc_test: ^9.1.7
  build_runner: ^2.4.9
  flutter_test:
    sdk: flutter
  husky: ^0.1.7
  lint: ^2.3.0
  mockito: ^5.4.4
  mocktail: ^1.0.3
  network_image_mock: ^2.1.1

flutter:
  assets:
    - .env
    - assets/backgrounds/
    - assets/images/
    - assets/logo/
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/logo_small.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true