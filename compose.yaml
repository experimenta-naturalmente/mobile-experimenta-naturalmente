services:
  # Runner
  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    restart: always
    container_name: gitlab-runner
    volumes:
      - ./gitlab-runner/config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock

  # Runner Register
  gitlab-runner-register:
    image: gitlab/gitlab-runner:latest
    restart: "no"
    container_name: gitlab-runner-register
    environment:
      - CI_SERVER_URL=${CI_SERVER_URL}
      - REGISTRATION_TOKEN=${REGISTRATION_TOKEN}
      - RUNNER_EXECUTOR=docker
    command: 
      - register 
      - --non-interactive
      - --locked=false
      - --url=${CI_SERVER_URL}
      - --registration-token=${REGISTRATION_TOKEN}
      - --executor=docker
      - --docker-image="cirruslabs/flutter:stable"
      - --description="gitlab-runner"
    volumes:
      - ./gitlab-runner/config:/etc/gitlab-runner

  # PROD Frontend
  #todo
  prod-frontend:
    image: alpine:latest
    ports:
      - "80:80"
    environment:
      - ENV=PROD

  # DEV Frontend
  #todo
  dev-frontend:
    image: alpine:latest
    ports:
      - "8082:80"
    environment:
      - ENV=DEV

  # MR Preview
  #todo
  mr-preview:
    image: alpine:latest
    ports:
      - "8083:8080"
    environment:
      - ENV=DEV