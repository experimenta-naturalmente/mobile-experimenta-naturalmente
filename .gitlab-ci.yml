image: "ghcr.io/cirruslabs/flutter:stable"

stages:
  - analyze_and_test
  - preview
  - deploy

code_quality:
  stage: analyze_and_test
  before_script:
    - export PATH="$PATH":"$HOME/.pub-cache/bin"
    - flutter --version
    - flutter pub global activate dart_code_metrics
    - apt-get update && apt-get install -y python3 python3-pip
    - ln -s /usr/bin/python3 /usr/bin/python
  script:
    - dart run dart_code_metrics:metrics lib --reporter=codeclimate | tee gl-code-quality-report.json
    - python check_issues.py gl-code-quality-report.json | tee -a gl-code-quality-report.json
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
  only:
    - merge_requests

analyze:
  stage: analyze_and_test
  before_script:
    - |
      cat <<EOF > .env
      EOF
  script:
    - flutter analyze --fatal-infos --fatal-warnings
  only:
    - merge_requests

test:
  stage: analyze_and_test
  before_script:
    - export PATH="$PATH":"$HOME/.pub-cache/bin"
    - flutter pub global activate junitreport
    - |
      cat <<EOF > .env
      EOF
  script:    
    - touch report.xml
  coverage: '/lines\.*: \d+\.\d+\%/'
  artifacts:
    name: "${CI_COMMIT_REF_NAME}_coverage"
    paths:
      - coverage/
    reports:
      junit: report.xml

deploy-preview:
  stage: preview
  image: node:bookworm
  before_script:
    - |
      cat <<EOF > .env
      AWS_ACCESS_KEY=$AWS_ACCESS_KEY
      AWS_SECRET_KEY=$AWS_SECRET_KEY
      AWS_REGION=$AWS_REGION
      AWS_BUCKET=$AWS_BUCKET
      API_URL=$API_URL
      GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY
      VERCEL_TOKEN=$VERCEL_TOKEN
      EOF
  script:
    - npm install --global vercel
    - vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
    - vercel build --token=$VERCEL_TOKEN
    - vercel deploy --prebuilt  --token=$VERCEL_TOKEN > deployment-url.txt
  after_script:
    - echo "🔝🔝 Deploying to Vercel... 🚀"
    - DEPLOYMENT_URL_CONTENT=$(cat deployment-url.txt)
    - |
      NEW_LINE=$'\n'
      JOB_URL="$CI_PROJECT_URL/-/jobs/$CI_JOB_ID"
      if [ "$CI_JOB_STATUS" == "success" ]; then
       BOT_MESSAGE="### ✔️ 🔥🔥 DEPLOY DE PREVIEW PRONTO !! 🔥🔥 ✔️${NEW_LINE}🚀🚀🚀 URL: $DEPLOYMENT_URL_CONTENT 👻👻"
      else
       BOT_MESSAGE="### ✖️ Oh no.. 😵 O deploy de preview falhou 😵 ✖️${NEW_LINE} Veja os [logs do job]($JOB_URL) e descubra o que aconteceu."
      fi
      curl -X POST \
        -H "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
        --form "body=$BOT_MESSAGE" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"
    - rm deployment-url.txt
  only:
    - merge_requests
  allow_failure: true
  when: manual

deploy_dev:
  stage: deploy
  before_script:
    - |
      cat <<EOF > .env
      AWS_ACCESS_KEY=$AWS_ACCESS_KEY
      AWS_SECRET_KEY=$AWS_SECRET_KEY
      AWS_REGION=$AWS_REGION
      AWS_BUCKET=$AWS_BUCKET
      API_URL=$API_URL
      GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY
      EOF
  script:
    - echo "🔝🔝 Deploying to DEV environment... 🚀"
    - flutter pub get
    - flutter build web --release --web-renderer html
    - mkdir -p /app/dev/usr/share/nginx/html
    - cp -r build/web/* /app/dev/usr/share/nginx/html/
    - ls -al /app/dev/usr/share/nginx/html
  artifacts:
    paths:
      - build/web/
  environment:
    name: dev
  only:
    - develop

deploy_prod:
  stage: deploy
  before_script:
    - |
      cat <<EOF > .env
      AWS_ACCESS_KEY=$AWS_ACCESS_KEY
      AWS_SECRET_KEY=$AWS_SECRET_KEY
      AWS_REGION=$AWS_REGION
      AWS_BUCKET=$AWS_BUCKET
      API_URL=$API_URL
      GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY
      EOF
  script:
    - echo "🔝🔝 Deploying to PROD environment... 🚀"
    - flutter pub get
    - flutter/bin/flutter config --enable-web
    - flutter build web --release
    - mkdir -p /app/prod/usr/share/nginx/html
    - cp -r build/web/* /app/prod/usr/share/nginx/html/
    - ls -al /app/prod/usr/share/nginx/html
  artifacts:
    paths:
      - build/web/
  environment:
    name: prod
  only:
    - main
